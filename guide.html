<style>.backapp{display:inline-block;margin:14px 18px 0;font:600 14px var(--font-body);color:var(--accent);text-decoration:none;padding:8px 0}.backapp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}</style>
<style>
/* Layout: centered wizard — track tabs, progress rail, phone mock beside step text, prev/next. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#e4eaf2; --line:#cfd8e4;
  --fg:#12202f; --muted:#56687c; --accent:#1764a8; --accent-2:#0b3d63; --accent-ink:#ffffff;
  --warn:#b8502f;
  /* мини-экран приложения — всегда в настоящей тёмной палитре SAFA Inspector, в обеих темах */
  --app-bg:#0e1620; --app-panel:#1b2a3d; --app-panel2:#152232; --app-line:#2b3f58; --app-hdr:#0b3d63;
  --app-fg:#e8eef6; --app-muted:#9db0c7; --app-accent:#3d9ae0; --app-ink:#ffffff;
  --app-ok:#2ea36b; --app-c1:#d9a441; --app-c2:#e07b39; --app-c3:#d94f4f; --app-g:#7e8fa6;
  --frame:#060b11; --frame-edge:#16202c;
  --r:16px; --r-sm:11px;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0a1119; --surface:#111b27; --surface-2:#172433; --line:#263649;
  --fg:#e6edf6; --muted:#9aadc2; --accent:#4aa3e6; --accent-2:#7cc0f2; --accent-ink:#04121f;
  --warn:#f08a5d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1119; --surface:#111b27; --surface-2:#172433; --line:#263649;
  --fg:#e6edf6; --muted:#9aadc2; --accent:#4aa3e6; --accent-2:#7cc0f2; --accent-ink:#04121f;
  --warn:#f08a5d; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-inline:18px;padding-block:22px 40px}

/* ---- шапка ---- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px;fill:var(--accent-ink)}
.ttl{font-family:var(--font-display);font-weight:700;font-size:clamp(19px,4.6vw,24px);
  letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.theme{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:17px;
  display:grid;place-items:center}
.theme:hover{color:var(--fg);border-color:var(--accent)}

/* ---- вкладки ---- */
.tabs{display:flex;gap:8px;background:var(--surface-2);padding:5px;border-radius:14px;
  border:1px solid var(--line);margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-family:var(--font-body);
  font-weight:600;font-size:14.5px;padding:10px 8px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:background .18s,color .18s}
.tab b{font-weight:700}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg)}
.tab .ic{font-size:16px}

/* ---- прогресс ---- */
.rail{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.dot{width:26px;height:6px;border-radius:99px;background:var(--line);border:0;padding:0;cursor:pointer;
  transition:background .2s,width .2s}
.dot.done{background:var(--accent)}
.dot.now{background:var(--accent);width:40px}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
  font-family:var(--font-mono)}

/* ---- сцена ---- */
.stage{display:grid;grid-template-columns:236px 1fr;gap:26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px;min-height:470px}
@media (max-width:620px){ .stage{grid-template-columns:1fr;gap:18px;padding:18px;text-align:center} }
.stepwrap{min-width:0;animation:fade .34s ease both}
.reduce .stepwrap{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin-bottom:8px}
.stitle{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,5vw,26px);
  letter-spacing:-.02em;line-height:1.12;text-wrap:balance;margin:0 0 10px}
.sdesc{font-size:15.5px;color:var(--fg);margin:0 0 14px;max-width:46ch}
.note{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;color:var(--muted);text-align:left;
  max-width:46ch}
@media (max-width:620px){ .sdesc,.note{margin-inline:auto} }
.note.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));
  background:color-mix(in srgb,var(--warn) 9%,var(--surface));color:var(--fg)}
.note .nic{flex:none;font-size:15px;line-height:1.3}

/* ---- телефон ---- */
.phone{justify-self:center;width:228px;flex:none}
.frame{position:relative;background:var(--frame);border-radius:30px;padding:9px;
  box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 0 0 1.5px var(--frame-edge)}
.scr{background:var(--app-bg);border-radius:22px;overflow:hidden;height:410px;position:relative;
  color:var(--app-fg);font-size:10px;line-height:1.35;display:flex;flex-direction:column;text-align:left}
/* шапка приложения */
.ah{display:flex;align-items:center;gap:6px;background:var(--app-hdr);padding:15px 10px 8px;flex:none}
.ah b{font-size:10.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ah .v{font-size:7.5px;opacity:.7;border-radius:5px;padding:1px 3px}
.ah .hb{background:rgba(255,255,255,.16);border-radius:6px;min-width:19px;height:19px;display:grid;
  place-items:center;font-size:11px;flex:none}
/* нижние вкладки приложения */
.an{display:flex;background:var(--app-panel2);border-top:1px solid var(--app-line);flex:none;padding:4px 2px 6px}
.an span{flex:1;text-align:center;font-size:6.5px;color:var(--app-muted);border-radius:6px;padding:2px 0}
.an span i{display:block;font-style:normal;font-size:11px;line-height:1.2}
.an span.on{color:var(--app-accent)}
.ab{padding:8px;flex:1;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:0}
.lead{font-size:8.5px;color:var(--app-muted)}
.mc{background:var(--app-panel);border:1px solid var(--app-line);border-radius:9px;padding:8px}
.mc h4{margin:0 0 4px;font-size:10px;font-weight:700}
.mr{display:flex;align-items:center;gap:7px;background:var(--app-panel);border:1px solid var(--app-line);
  border-radius:9px;padding:7px 8px}
.mr .mi{font-size:13px;flex:none}
.mr b{font-size:9.5px;font-weight:600;display:block}
.mr small{font-size:7.5px;color:var(--app-muted);display:block}
.mr .g{flex:1;min-width:0}
.pl{display:inline-block;border-radius:99px;padding:1px 6px;font-size:7.5px;font-weight:700;white-space:nowrap;
  border:1px solid var(--app-line);color:var(--app-muted)}
.pl.c1{color:var(--app-c1);border-color:var(--app-c1)}
.pl.c2{color:var(--app-c2);border-color:var(--app-c2)}
.pl.c3{color:var(--app-c3);border-color:var(--app-c3)}
.pl.ok{color:var(--app-ok);border-color:var(--app-ok)}
.pl.hp{color:var(--app-c2);border-color:var(--app-c2)}
.mb{background:var(--app-accent);color:var(--app-ink);text-align:center;font-weight:700;font-size:9.5px;
  padding:8px;border-radius:8px}
.mb.sec{background:var(--app-panel);border:1px solid var(--app-line);color:var(--app-fg);font-weight:600}
.fld{font-size:7.5px;color:var(--app-muted)}
.inp{margin-top:2px;background:var(--app-panel2);border:1px solid var(--app-line);border-radius:7px;
  padding:6px 7px;font-size:9px;color:var(--app-fg);min-height:25px}
.rowx{display:flex;gap:5px;align-items:center}
.rowx>*{min-width:0}
.it{display:flex;align-items:stretch;background:var(--app-panel);border:1px solid var(--app-line);
  border-radius:9px;overflow:hidden}
.it .lab{flex:1;min-width:0;padding:5px 7px}
.it .lab small{display:block;font-size:7.5px;color:var(--app-muted);font-weight:700}
.it .lab small em{font-style:normal;color:var(--app-c2)}
.it .lab span{font-size:9px}
.it .sw{display:flex;flex:none}
.it .sw i{font-style:normal;width:22px;display:grid;place-items:center;border-left:1px solid var(--app-line);
  color:var(--app-muted);font-size:10px}
.it .sw i.on{background:var(--app-accent);color:var(--app-ink)}
.it .sw i.bad{background:var(--app-c3);color:var(--app-ink)}
.sech{display:flex;align-items:center;gap:6px;font-weight:700;font-size:9.5px}
.sech u{text-decoration:none;background:var(--app-hdr);border-radius:5px;padding:0 6px}
ul.hn{margin:0;padding-left:14px;font-size:8.5px}
ul.hn li{margin-bottom:2px}
.imp{border-left:3px solid var(--app-c1);background:rgba(217,164,65,.12);border-radius:0 6px 6px 0;
  padding:5px 6px;font-size:8px;margin-top:5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tile{background:var(--app-panel);border:1px solid var(--app-line);border-radius:8px;overflow:hidden}
.tile .ph{height:44px;background:linear-gradient(135deg,#2a3a4d,#42566d 55%,#1c2836);position:relative}
.tile .ph::after{content:"";position:absolute;left:18%;top:30%;width:46%;height:3px;border-radius:2px;
  background:rgba(0,0,0,.55);transform:rotate(-14deg)}
.tile .ph.b{background:linear-gradient(135deg,#4a2f2a,#7a4a3a 55%,#2b1d1a)}
.tile div.cp{padding:4px 5px;font-size:7.5px}
.tile .tg{display:inline-block;font-size:6.5px;font-weight:700;border-radius:4px;padding:0 3px;
  background:rgba(217,79,79,.22);color:var(--app-c3)}
.opt{background:var(--app-panel2);border:1px solid var(--app-line);border-radius:8px;padding:6px 7px;font-size:8.5px}
.opt.on{border-color:var(--app-accent);background:rgba(61,154,224,.14)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--app-bg);border-radius:13px 13px 0 0;
  border-top:1px solid var(--app-line);padding:9px 8px 10px;display:flex;flex-direction:column;gap:5px;
  box-shadow:0 -14px 30px rgba(0,0,0,.55)}
.sheet h4{margin:0 0 2px;font-size:10.5px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.kpi{background:var(--app-panel2);border:1px solid var(--app-line);border-radius:8px;padding:6px}
.kpi b{display:block;font-size:15px;color:var(--app-accent);line-height:1.1}
.kpi span{font-size:7.5px;color:var(--app-muted)}
.sig{background:#fff;border-radius:7px;height:34px;position:relative}
.sig::after{content:"";position:absolute;left:14%;right:22%;top:54%;height:9px;border-bottom:1.5px solid #1b2a3d;
  border-radius:0 0 60% 40%;transform:rotate(-4deg)}
.lockc{flex:1;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:16px;text-align:center}
.lockc b{font-size:15px}
.brow{display:flex;align-items:center;gap:6px;background:#1f2937;padding:14px 8px 7px;font-size:8px;color:#cbd5e1;flex:none}
.brow .url{flex:1;background:#111827;border-radius:99px;padding:3px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.menu{position:absolute;right:6px;top:34px;width:150px;background:#1f2937;border:1px solid #374151;
  border-radius:9px;padding:4px;font-size:8.5px;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.menu div{padding:6px 7px;border-radius:6px;color:#e5e7eb}

/* подсветка: куда нажимать */
.hl{position:relative;border-color:var(--app-accent)!important;
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--app-accent) 60%,transparent)}
.hl::after{content:"";position:absolute;right:6px;top:50%;margin-top:-12px;width:24px;height:24px;
  border-radius:99px;border:2px solid #fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--app-accent) 45%,transparent);
  animation:tap 1.5s ease-out infinite;pointer-events:none;z-index:4}
.hl.mid::after{right:50%;margin-right:-12px}
.reduce .hl::after{animation:none;opacity:.8}
@keyframes tap{0%{transform:scale(.6);opacity:1}70%{transform:scale(1.25);opacity:.3}100%{transform:scale(1.35);opacity:0}}

/* ---- навигация ---- */
.nav{display:flex;align-items:center;gap:12px;margin-top:18px}
.btn{font-family:var(--font-body);font-weight:700;font-size:15px;border-radius:12px;padding:13px 20px;
  cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);margin-left:auto}
.btn.primary.done{background:var(--surface);color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.dot:focus-visible,.theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6}
.foot a{color:var(--accent);font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">

<div class="wrap">
  <header class="top">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span>
    <div>
      <div class="ttl">Как провести инспекцию</div>
      <div class="sub">SAFA Inspector · пошагово</div>
    </div>
    <button class="theme" id="theme" aria-label="Сменить тему">◐</button>
  </header>

  <div class="tabs" role="tablist" aria-label="Что нужно">
    <button class="tab" id="tab-ramp" role="tab" aria-selected="true" aria-controls="stage"><span class="ic">✈️</span> Я <b>на перроне</b></button>
    <button class="tab" id="tab-prepare" role="tab" aria-selected="false" aria-controls="stage"><span class="ic">📖</span> Я <b>готовлюсь</b></button>
  </div>

  <div class="rail">
    <div class="dots" id="dots"></div>
    <div class="count" id="count"></div>
  </div>

  <section class="stage" id="stage">
    <div class="phone"><div class="frame"><div class="scr" id="screen"></div></div></div>
    <div class="stepwrap" id="stepwrap">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 class="stitle" id="stitle"></h2>
      <p class="sdesc" id="sdesc"></p>
      <div id="noteSlot"></div>
    </div>
  </section>

  <div class="nav">
    <button class="btn" id="prev">← Назад</button>
    <button class="btn primary" id="next">Дальше →</button>
  </div>

  <p class="foot">
    Приложение: <a href="https://bsheraliev.github.io/ramp-inspector/">bsheraliev.github.io/ramp-inspector</a><br>
    Чек-лист и формулировки находок — по EASA Ramp Inspection Manual, Appendix 1.
  </p>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const VER='v1.7.3';
function hdr(title,o){o=o||{};return `<div class="ah">${o.back?'<span class="hb">‹</span>':''}<b>${title}</b><span class="v ${o.hlVer?'hl mid':''}">${VER}</span>${o.act?`<span class="hb ${o.hlAct?'hl mid':''}">${o.act}</span>`:''}</div>`;}
function tabs(on,hl){const T=[['list','📋','Инспекции'],['ref','📖','Справочник'],['train','🎓','Тренажёр'],['stats','📊','Сводка'],['set','⚙️','Настройки']];
  return `<div class="an">${T.map(t=>`<span class="${t[0]===on?'on':''} ${t[0]===hl?'hl mid':''}"><i>${t[1]}</i>${t[2]}</span>`).join('')}</div>`;}
function body(inner){return `<div class="ab">${inner}</div>`;}
function item(id,name,st,o){o=o||{};const sw=[['ok','✓'],['na','N'],['f','!']].map(s=>`<i class="${st===s[0]?(s[0]==='f'?'bad':'on'):''} ${o.hl===s[0]?'hl mid':''}">${s[1]}</i>`).join('');
  return `<div class="it"><div class="lab ${o.hlLab?'hl':''}"><small>${id}${o.star?' <em>★</em>':''}${o.extra||''}</small><span>${name}</span></div><div class="sw">${sw}</div></div>`;}

const TRACKS={
ramp:[
 {eye:'Шаг 1',t:'Войдите по паролю',d:'Откройте приложение по ссылке и введите пароль, который вам сообщили в управлении.',
  note:['📶','Первый вход — с интернетом. Дальше приложение работает на перроне без связи.'],
  scr:`<div class="lockc"><b>SAFA Inspector</b><div class="lead">Вход для инспекторов</div>
   <div class="inp" style="text-align:left;letter-spacing:.2em">••••••••••</div>
   <div class="mb hl mid">Войти</div>
   <div class="lead" style="margin-top:6px;text-decoration:underline;color:var(--app-accent)">Демо без пароля</div>
   <div class="lead">${VER}</div></div>`},
 {eye:'Шаг 2',t:'Поставьте на главный экран',d:'В меню браузера выберите «Добавить на главный экран». Появится значок, как у обычного приложения.',
  note:['📲','iPhone: кнопка «Поделиться» → «На экран Домой». Android: меню ⋮ → «Установить приложение».'],
  scr:`<div class="brow"><span class="url">bsheraliev.github.io/ramp-inspector</span><span>⋮</span></div>
   ${hdr('Инспекции на перроне',{act:'+'})}${body(`<div class="mc"><div class="lead">Инспекций пока нет</div></div>`)}
   <div class="menu"><div>Новая вкладка</div><div>Закладки</div><div class="hl" style="border:1px solid transparent">Добавить на гл. экран</div><div>Настройки</div></div>
   ${tabs('list')}`},
 {eye:'Шаг 3',t:'Заполните свои данные',d:'Вкладка «Настройки»: ФИО, должность и аэропорт по умолчанию. Они подставятся в каждый акт.',
  note:['🌐','Там же переключается язык интерфейса: русский или английский.'],
  scr:hdr('Настройки')+body(`<div class="mc"><h4>Инспектор</h4>
    <div class="fld">Ф.И.О. инспектора<div class="inp hl">Каримов Фаррух</div></div>
    <div class="fld" style="margin-top:4px">Должность<div class="inp">Главный специалист</div></div>

let track='ramp', i=0;
const stepwrap=$('#stepwrap');
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

function render(animate){
  const steps=TRACKS[track], s=steps[i];
  $('#tab-ramp').setAttribute('aria-selected',track==='ramp');
  $('#tab-prepare').setAttribute('aria-selected',track==='prepare');
  $('#dots').innerHTML=steps.map((_,k)=>`<button class="dot ${k<i?'done':''} ${k===i?'now':''}" data-k="${k}" aria-label="Шаг ${k+1}"></button>`).join('');
  $('#count').textContent=`${i+1} / ${steps.length}`;
  $('#screen').innerHTML=s.scr;
  if(animate!==false){ stepwrap.style.animation='none'; void stepwrap.offsetWidth; stepwrap.style.animation=''; }
  $('#eyebrow').textContent=s.eye;
  $('#stitle').textContent=s.t;
  $('#sdesc').textContent=s.d;
  $('#noteSlot').innerHTML = s.note ? `<div class="note ${s.note[2]?'warn':''}"><span class="nic">${s.note[0]}</span><span>${s.note[1]}</span></div>` : '';
  $('#prev').disabled=i===0;
  const last=i===steps.length-1, nx=$('#next');
  nx.classList.toggle('done',last);
  nx.textContent = last ? '↻ С начала' : 'Дальше →';
  store.set('safa_guide_track',track);
}
function go(d){ const n=TRACKS[track].length; i=Math.min(Math.max(0,i+d),n-1); render(); }
function setTrack(t){ if(t===track)return; track=t; i=0; render(); }

$('#next').onclick=()=>{ if(i===TRACKS[track].length-1){ i=0; render(); } else go(1); };
$('#prev').onclick=()=>go(-1);
$('#tab-ramp').onclick=()=>setTrack('ramp');
$('#tab-prepare').onclick=()=>setTrack('prepare');
$('#dots').onclick=e=>{ const d=e.target.closest('.dot'); if(d){ i=+d.dataset.k; render(); } };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1); });
// листание пальцем по сцене
(function(){ let x0=null; const st=$('#stage');
  st.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; },{passive:true});
  st.addEventListener('touchend',e=>{ if(x0===null)return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>50) go(dx<0?1:-1); },{passive:true});
})();

// переключатель темы
const root=document.documentElement;
(function(){ const t=store.get('safa_guide_theme'); if(t==='dark'||t==='light')root.setAttribute('data-theme',t); })();
$('#theme').onclick=()=>{
  const cur=root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';
  root.setAttribute('data-theme',nx); store.set('safa_guide_theme',nx);
};
if(matchMedia('(prefers-reduced-motion:reduce)').matches) document.body.classList.add('reduce');

// прямая ссылка на вкладку: #ramp или #prepare
(function(){
  const h=(location.hash||'').replace('#','');
  if(h==='ramp'||h==='prepare') track=h;
  else { const t=store.get('safa_guide_track'); if(t==='ramp'||t==='prepare') track=t; }
  render(false);
})();
</script>
